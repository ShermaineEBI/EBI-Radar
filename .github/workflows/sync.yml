name: Sync Content

on:
  schedule:
    # 默认:每周一 11:00 大马时间(UTC 03:00)。想改时间就编辑这一行的 cron。
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync competitors
        env:
          TRACKER: IG
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_content.py
      # Facebook 专页(competitors 表里 tracker = 'FB' 的那几行)。
      # 出错也不会挡住后面的转录 / 拆解 / dashboard,IG 照常更新。
      - name: Sync Facebook competitors
        continue-on-error: true
        env:
          TRACKER: FB
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_content.py
      # TikTok / LinkedIn / 小红书(competitors 表里 tracker = 'TT' / 'LI' / 'XHS')。
      # 同样出错不挡后面的步骤;表里没有这个平台的竞对就直接跳过,不花钱。
      - name: Sync TikTok competitors
        continue-on-error: true
        env:
          TRACKER: TT
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_content.py
      - name: Sync LinkedIn competitors
        continue-on-error: true
        env:
          TRACKER: LI
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_content.py
      - name: Sync Xiaohongshu competitors
        continue-on-error: true
        env:
          TRACKER: XHS
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_content.py
